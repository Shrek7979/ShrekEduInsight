# 수학·물리·화학·생명과학 사이트의 데이터를 모아 GitHub Pages 에 배포합니다.
# 뉴스 수집은 각 과목 사이트가 하고, 이 사이트는 페이지를 열 때마다 그 최신 데이터를 직접 읽어 오므로
# 여기서는 첫 화면용 데이터만 가끔 새로 굽습니다 (예약 실행이 밀리거나 빠져도 사이트 내용은 최신으로 보임).
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번만 바꿔 주면 됩니다.
name: Publish

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 정적 사이트 빌드 (네 과목 데이터를 받아 첫 화면 생성)
        env:
          STATIC_EXPORT: '1'
          BASE_PATH: /${{ github.event.repository.name }}
          TZ: Asia/Seoul
        run: |
          # GitHub Pages 주소는 소문자 (Shrek7979 → shrek7979.github.io)
          export NEXT_PUBLIC_SITE_URL="https://$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z').github.io/${{ github.event.repository.name }}"
          npm run build
          touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true # 저장소에 Pages 가 아직 안 켜져 있으면 자동으로 켬
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
