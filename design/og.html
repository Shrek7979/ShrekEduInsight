<!doctype html>
<!-- 링크 미리보기 이미지(public/og.jpg, 1200×630)의 원본. 고친 뒤 scripts/make-og.ps1 로 다시 찍음 -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #08090b; }
  body { font-family: 'Pretendard Variable', 'Malgun Gothic', sans-serif; color: #fff; position: relative; -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; inset: 0; }
  .text { position: absolute; left: 76px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 0.22em; color: rgba(255,255,255,0.5); }
  .eyebrow b { color: #fcd34d; font-weight: 800; }
  h1 { margin-top: 18px; font-size: 92px; font-weight: 800; line-height: 0.98; letter-spacing: -0.035em; }
  .g { color: #34d399; } .y { color: #fcd34d; }
  .tag { margin-top: 26px; font-size: 33px; font-weight: 700; letter-spacing: -0.02em; color: rgba(255,255,255,0.88); }
  .chips { margin-top: 30px; display: flex; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.13); background: rgba(255,255,255,0.05); font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.88); }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>
<body>
<svg class="bg" width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowM" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e879f9" stop-opacity="0.35"/><stop offset="1" stop-color="#e879f9" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.32"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#34d399" stop-opacity="0.32"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.55"><stop offset="0" stop-color="#fff7d6"/><stop offset="0.45" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fcd34d" stop-opacity="0.55"/><stop offset="0.5" stop-color="#fcd34d" stop-opacity="0.12"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
    <linearGradient id="lineM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e879f9"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
    <linearGradient id="lineP" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
    <linearGradient id="lineC" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
    <linearGradient id="lineB" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- 바탕: 옅은 모눈 + 네 과목 색 빛 -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="300" fill="url(#glowP)"/>
  <circle cx="700" cy="40" r="260" fill="url(#glowM)"/>
  <circle cx="1120" cy="600" r="300" fill="url(#glowC)"/>
  <circle cx="660" cy="620" r="260" fill="url(#glowB)"/>
  <circle cx="0" cy="315" r="380" fill="url(#glowB)" opacity="0.35"/>

  <!-- 융합 그림: 네 과목이 가운데 '인사이트'로 모임 -->
  <g transform="translate(905 315)">
    <circle r="196" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-dasharray="3 9"/>
    <circle r="132" fill="none" stroke="#fff" stroke-opacity="0.07"/>
    <circle r="250" fill="none" stroke="#fff" stroke-opacity="0.05"/>

    <!-- 연결선 -->
    <line x1="-139" y1="-139" x2="-42" y2="-42" stroke="url(#lineM)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="139" y1="-139" x2="42" y2="-42" stroke="url(#lineP)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="139" y1="139" x2="42" y2="42" stroke="url(#lineC)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="-139" y1="139" x2="-42" y2="42" stroke="url(#lineB)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <!-- 선 위를 흐르는 작은 빛 -->
    <circle cx="-92" cy="-92" r="4" fill="#fff"/><circle cx="92" cy="-92" r="4" fill="#fff"/>
    <circle cx="92" cy="92" r="4" fill="#fff"/><circle cx="-92" cy="92" r="4" fill="#fff"/>

    <!-- 가운데: 인사이트(전구) -->
    <circle r="120" fill="url(#coreGlow)"/>
    <circle r="62" fill="#14120a" stroke="#fcd34d" stroke-opacity="0.6" stroke-width="2"/>
    <g transform="translate(0 -4)">
      <path d="M0 -34 C19 -34 32 -20 32 -3 C32 9 25 17 19 23 C16 26 15 29 15 33 L-15 33 C-15 29 -16 26 -19 23 C-25 17 -32 9 -32 -3 C-32 -20 -19 -34 0 -34 Z" fill="url(#core)"/>
      <rect x="-13" y="37" width="26" height="6" rx="3" fill="#fcd34d"/>
      <rect x="-9" y="46" width="18" height="5" rx="2.5" fill="#fcd34d" opacity="0.8"/>
      <path d="M-8 6 L0 -6 L8 6" fill="none" stroke="#7c4a03" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="0" y1="-6" x2="0" y2="22" stroke="#7c4a03" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <!-- 반짝임 -->
    <g stroke="#fcd34d" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-78" x2="0" y2="-92"/><line x1="55" y1="-55" x2="65" y2="-65"/><line x1="-55" y1="-55" x2="-65" y2="-65"/>
      <line x1="78" y1="0" x2="92" y2="0"/><line x1="-78" y1="0" x2="-92" y2="0"/>
    </g>

    <!-- 수학: ∑ -->
    <g transform="translate(-139 -139)">
      <circle r="58" fill="#e879f9" fill-opacity="0.12"/>
      <circle r="50" fill="#120c14" stroke="#e879f9" stroke-width="2.5"/>
      <path d="M17 -20 L-15 -20 L4 0 L-15 20 L17 20" fill="none" stroke="#f0abfc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- 물리: 원자 -->
    <g transform="translate(139 -139)">
      <circle r="58" fill="#38bdf8" fill-opacity="0.12"/>
      <circle r="50" fill="#0a1218" stroke="#38bdf8" stroke-width="2.5"/>
      <g fill="none" stroke="#7dd3fc" stroke-width="3.2">
        <ellipse rx="31" ry="11"/>
        <ellipse rx="31" ry="11" transform="rotate(60)"/>
        <ellipse rx="31" ry="11" transform="rotate(120)"/>
      </g>
      <circle r="5.5" fill="#e0f2fe"/>
    </g>
    <!-- 화학: 벤젠 고리 -->
    <g transform="translate(139 139)">
      <circle r="58" fill="#fbbf24" fill-opacity="0.12"/>
      <circle r="50" fill="#16120a" stroke="#fbbf24" stroke-width="2.5"/>
      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" fill="none" stroke="#fde68a" stroke-width="3.6" stroke-linejoin="round"/>
      <circle r="13" fill="none" stroke="#fde68a" stroke-width="3"/>
    </g>
    <!-- 생명과학: DNA -->
    <g transform="translate(-139 139)">
      <circle r="58" fill="#34d399" fill-opacity="0.12"/>
      <circle r="50" fill="#0a1611" stroke="#34d399" stroke-width="2.5"/>
      <g fill="none" stroke="#6ee7b7" stroke-width="3.4" stroke-linecap="round">
        <path d="M-14 -30 C14 -18 14 -6 -14 6 C-42 18 14 22 14 30" opacity="0"/>
        <path d="M-13 -30 C17 -15 17 -1 0 0 C-17 1 -17 15 13 30"/>
        <path d="M13 -30 C-17 -15 -17 -1 0 0 C17 1 17 15 -13 30"/>
      </g>
      <g stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
        <line x1="-6" y1="-22" x2="6" y2="-22"/><line x1="-9" y1="-12" x2="9" y2="-12"/>
        <line x1="-9" y1="12" x2="9" y2="12"/><line x1="-6" y1="22" x2="6" y2="22"/>
      </g>
    </g>

    <!-- 과목 이름 -->
    <g font-family="Pretendard Variable, Malgun Gothic, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
      <text x="-139" y="-212" fill="#f0abfc">수학</text>
      <text x="139" y="-212" fill="#7dd3fc">물리</text>
      <text x="139" y="228" fill="#fde68a">화학</text>
      <text x="-139" y="228" fill="#6ee7b7">생명과학</text>
    </g>
  </g>
</svg>

<div class="text">
  <p class="eyebrow">STEM CONVERGENCE · <b>EDU INSIGHT</b></p>
  <h1><span class="g">Shrek</span> Edu<br /><span class="y">Insight</span></h1>
  <p class="tag">오늘의 수학&amp;과학, 수업이 되는 뉴스</p>
  <div class="chips">
    <span class="chip"><span class="dot" style="background:#e879f9"></span>수학</span>
    <span class="chip"><span class="dot" style="background:#38bdf8"></span>물리</span>
    <span class="chip"><span class="dot" style="background:#fbbf24"></span>화학</span>
    <span class="chip"><span class="dot" style="background:#34d399"></span>생명과학</span>
  </div>
</div>
</body>
</html>
